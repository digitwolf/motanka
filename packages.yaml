# Package_Map: one outcome per Supported_Release for every package named in
# Upstream's package lists.
#
# Upstream pin: basecamp/omarchy v4.5.0 (stable),
#   commit ac2690cd7be4f47e4a255f5e2e78d904d436b068
# Lists: install/omarchy-base.packages, install/omarchy-other.packages and
#   install/omarchy-x86_64-only.packages. The aarch64 lists are out of scope.
#
# Format: a strict YAML subset, documented in tools/pkgmap. Entries are
# sorted in byte order; each has `all` or one line per release:
#   name:
#     all: {apt: ubuntu-name}               or {apt: [name, name]}
#     noble: {motanka: motanka-pkg, reason: "..."}
#     resolute: {flatpak: org.example.App, reason: "..."}
#   binary: {binary: {dest: /opt/motanka/..., sha256: <hex>, url: "https://..."}, reason: "..."}
#   skip:   {skip: "reason"}
# Every outcome other than apt carries a reason. On apt, a reason is a note.
#
# This file is maintained by hand. After a pin bump, check it with
#   tools/pkgmap validate --upstream <upstream-tree> --aptnames <dir>
# where <dir> holds noble.txt and resolute.txt, every package name in that
# release's main and universe archive (with -updates and -security), one
# per line. Validation names each Upstream package without an entry and
# each apt name missing from a release; add or fix those entries and rerun.
# Build input for a release: tools/pkgmap compile <release> -o package-map.tsv

