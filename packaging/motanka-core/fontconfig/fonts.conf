<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Installed as /opt/motanka/share/motanka/fontconfig/fonts.conf by
  motanka-core: the font configuration of the Motanka session only.

  The session launcher (/opt/motanka/libexec/motanka/session) sets
  FONTCONFIG_PATH=/opt/motanka/share/motanka/fontconfig, so programs of the
  session (Hyprland, Upstream's Quickshell shell on the Stack's Qt, GTK and
  terminals; everything that uses libfontconfig) load this file instead of
  /etc/fonts/fonts.conf. No file of the system names this folder, so other
  sessions keep the system configuration and do not see the fonts in
  /opt/motanka/share/fonts (requirement 5.10).

  In order:
    1. /opt/motanka/share/fonts, the fonts of motanka-fonts (JetBrainsMono
       Nerd Font, which Upstream's bar, menus and terminals use);
    2. Upstream's own fontconfig rules, unchanged from the vendored tree
       (on Arch, Upstream's package installs them into /etc/fonts/conf.d at
       position 50): "monospace" becomes JetBrainsMono Nerd Font, and the
       CJK, Arabic and emoji fallbacks Upstream chooses. Loaded first, so
       its monospace rule runs before the system's 60-latin.conf adds its
       own preferred monospace fonts in front of it;
    3. the system configuration, unchanged, with its conf.d rules, font
       folders, caches and the user's ~/.config/fontconfig files, which
       stay in charge of everything else (Upstream's "omarchy-font-set"
       writes ~/.config/fontconfig/fonts.conf, which is loaded after 2).
  motanka-core's build fails when the vendored tree lacks a file named in
  step 2.
-->
<fontconfig>
  <dir>/opt/motanka/share/fonts</dir>
  <include ignore_missing="yes">/opt/motanka/share/omarchy/default/fontconfig/conf.avail/50-omarchy.conf</include>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
</fontconfig>
