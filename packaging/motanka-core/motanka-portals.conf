# Installed as /usr/share/xdg-desktop-portal/motanka-portals.conf by
# motanka-core. xdg-desktop-portal reads <desktop>-portals.conf for the
# names in XDG_CURRENT_DESKTOP, lowercased; the Motanka session sets
# Motanka:Hyprland, so this file applies there and nowhere else. The
# choices are Upstream's (config/xdg-desktop-portal/hyprland-portals.conf).
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
